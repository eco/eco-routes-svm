deploy-devnet = "anchor deploy --provider.cluster devnet --program-name portal && anchor deploy --provider.cluster devnet --program-name hyper-prover && anchor deploy --provider.cluster devnet --program-name local-prover && anchor deploy --provider.cluster devnet --program-name flash-fulfiller && anchor deploy --provider.cluster devnet --program-name proof-helper && anchor deploy --provider.cluster devnet --program-name aggregator-prover && anchor deploy --provider.cluster devnet --program-name polymer-prover"
deploy-mainnet = "anchor deploy --provider.cluster mainnet --program-name portal && anchor deploy --provider.cluster mainnet --program-name hyper-prover && anchor deploy --provider.cluster mainnet --program-name local-prover && anchor deploy --provider.cluster mainnet --program-name flash-fulfiller && anchor deploy --provider.cluster mainnet --program-name proof-helper && anchor deploy --provider.cluster mainnet --program-name aggregator-prover && anchor deploy --provider.cluster mainnet --program-name polymer-prover"
test = "cargo test --no-fail-fast"
