[package]
name = "deployer"
version = "0.1.0"
edition = "2021"

# Its own workspace and lockfile: the RPC client's dependency tree must never take part in
# the programs' feature and version resolution, which decides their bytecode and addresses.
[workspace]

[dependencies]
aggregator-prover = { path = "../../programs/aggregator-prover", features = ["no-entrypoint"] }
anchor-lang = "1.1.2"
bincode = "1.3"
clap = { version = "4", features = ["derive", "env"] }
eco-svm-std = { path = "../eco-svm-std" }
hex = "0.4"
hyper-prover = { path = "../../programs/hyper-prover", features = ["no-entrypoint"] }
layerzero-prover = { path = "../../programs/layerzero-prover", features = ["no-entrypoint"] }
polymer-prover = { path = "../../programs/polymer-prover", features = ["no-entrypoint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-address-lookup-table-interface = { version = "3.1", features = ["bincode", "bytemuck"] }
solana-cluster-type = "3.1"
solana-commitment-config = "3.1"
solana-compute-budget-interface = "3.0.0"
solana-loader-v3-interface = { version = "8.0.1", features = ["serde"] }
solana-rpc-client = "4.2"
solana-rpc-client-api = "4.2"
solana-sdk = "4.0.1"
solana-sdk-ids = "3.1"
solana-sha256-hasher = "3.1"
solana-system-interface = { version = "3.1", features = ["bincode"] }
thiserror = "2"

[dev-dependencies]
goldie = "0.7.0"
litesvm = "0.16.0"
local-prover = { path = "../../programs/local-prover", features = ["no-entrypoint"] }
mock-layerzero-endpoint = { path = "../../programs/mock-layerzero-endpoint", features = ["no-entrypoint"] }
tempfile = "3"

[profile.release]
overflow-checks = true
