[package]
name = "portal"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

# Pins the platform-tools for a plain `cargo build-sbf`, which is what `solana-verify build`
# (and the remote verify-from-repo) runs: that path cannot pass `--tools-version`, and without
# this it would compile with the Solana CLI's default instead of the v1.52 that anchor-cli 1.1.2
# hard-codes and CI asserts (SBF_TOOLS_VERSION). Keep the two in step.
[package.metadata.solana]
tools-version = "v1.52"

[lib]
crate-type = ["cdylib", "lib"]
name = "portal"

[features]
mainnet = ["eco-svm-std/mainnet"]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
derive-new = { workspace = true }
eco-svm-std = { workspace = true }
itertools = "0.15.0"
# Anchor 1.x's `solana_program` facade no longer re-exports a `keccak` module (the
# monolithic solana-program crate isn't its primary dep); take the granular crate
# directly for the syscall-backed hashv the executor-ATA digest uses on-chain.
solana-keccak-hasher = "3.1"
tiny-keccak = { workspace = true }

[target.'cfg(target_os = "solana")'.dependencies]
getrandom = { workspace = true }

[dev-dependencies]
goldie = { workspace = true }

