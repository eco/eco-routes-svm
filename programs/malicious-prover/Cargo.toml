[package]
name = "malicious-prover"
version = "0.1.0"
description = "Confused-deputy PoC prover for eco-routes-svm testing (localnet only)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "malicious_prover"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
eco-svm-std = { workspace = true }
