[package]
description = "Localnet stand-in for Polymer's polymer_prover program"
edition = "2021"
name = "mock-polymer-prover"
version = "0.1.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "mock_polymer_prover"

[features]
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []

[dependencies]
anchor-lang = { workspace = true }
