[package]
name = "intent-chainer"
version = "0.1.0"
description = "Publishes an intent whose reward amount is only known once an earlier intent executes."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "intent_chainer"

[features]
mainnet = ["eco-svm-std/mainnet", "portal/mainnet"]
default = []
# Local SBF profiling only; leave disabled in release builds.
resource-metrics = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { workspace = true, features = ["event-cpi"] }
anchor-spl = { workspace = true }
derive-new = { workspace = true }
eco-svm-std = { workspace = true }
portal = { workspace = true, features = ["no-entrypoint"] }
solana-keccak-hasher = "3.1"
tiny-keccak = { workspace = true }

# Client-side rendering needs the host hash implementation; SBF uses the syscall.
[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-keccak-hasher = { version = "3.1", features = ["sha3"] }

# The k256 → getrandom path (via anchor's solana-secp256k1-recover) needs a
# getrandom backend for the SBF target; enable the custom backend there only.
[target.'cfg(target_os = "solana")'.dependencies]
getrandom = { workspace = true }

[dev-dependencies]
goldie = { workspace = true }
serde_json = "1"
