name: 'Setup Anchor'
description: 'Install Solana CLI and Anchor CLI with caching'
inputs:
  anchor-version:
    description: 'Anchor CLI version to install'
    required: true
  solana-version:
    description: 'Solana CLI version to install (exact, no leading v)'
    required: true

runs:
  using: 'composite'
  steps:
    # Native deps for building avm / anchor-cli from source. These used to arrive as a side
    # effect of the upstream "latest stable" install script; declared here so they do not
    # depend on what that script happens to do.
    - name: Install build dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential pkg-config libssl-dev libudev-dev \
          llvm libclang-dev protobuf-compiler libprotobuf-dev

    # Keyed on both versions because this path holds two different things. ~/.local/share/solana
    # is the CLI, which the Solana version decides; ~/.cache/solana holds the platform-tools that
    # compile the on-chain programs, which anchor-cli picks via its hard-coded --tools-version, so
    # the Anchor version decides those. Omit the Anchor version and a bump keeps hitting the old
    # key: actions/cache does not save on a hit, so the new platform-tools would be re-downloaded
    # on every run, forever. Keyed on "stable" instead of exact versions, an eviction would
    # silently swap in whatever the installer serves that day.
    - name: Cache Solana installation
      id: cache-solana
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/solana
          ~/.local/share/solana
        key: solana-v${{ inputs.solana-version }}-anchor-${{ inputs.anchor-version }}-${{ runner.os }}

    # Pinned installer, not the "latest stable" convenience script: that one resolves to a
    # moving target and also side-installs Anchor, surfpool, and Node, none of which this
    # workflow uses (Anchor comes from avm below).
    - name: Install Solana CLI
      if: steps.cache-solana.outputs.cache-hit != 'true'
      shell: bash
      run: |
        sh -c "$(curl --proto '=https' --tlsv1.2 -sSfL https://release.anza.xyz/v${{ inputs.solana-version }}/install)"
        echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

    - name: Add Solana to PATH
      if: steps.cache-solana.outputs.cache-hit == 'true'
      shell: bash
      run: echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

    - name: Cache Anchor installation
      id: cache-anchor
      uses: actions/cache@v4
      with:
        path: |
          ~/.avm
          ~/.cargo/bin/anchor
          ~/.cargo/bin/avm
        key: anchor-${{ inputs.anchor-version }}-${{ runner.os }}

    - name: Install AVM (Anchor Version Manager)
      if: steps.cache-anchor.outputs.cache-hit != 'true'
      shell: bash
      # Build the Anchor toolchain with stable Rust: avm/anchor-cli pull
      # cargo_metadata -> cargo-platform, which now requires rustc >= 1.91,
      # newer than the programs' pinned 1.89. The programs still build on 1.89.
      run: |
        export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
        rustup toolchain install stable --profile minimal --no-self-update
        cargo +stable install --git https://github.com/coral-xyz/anchor avm --locked --force

    - name: Install Anchor CLI
      if: steps.cache-anchor.outputs.cache-hit != 'true'
      shell: bash
      run: |
        export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.cargo/bin:$PATH"
        RUSTUP_TOOLCHAIN=stable avm install ${{ inputs.anchor-version }}
        avm use ${{ inputs.anchor-version }}

    - name: Add Anchor to PATH
      shell: bash
      run: |
        echo "$HOME/.avm/bin" >> $GITHUB_PATH
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Set Anchor version (cached)
      if: steps.cache-anchor.outputs.cache-hit == 'true'
      shell: bash
      run: |
        export PATH="$HOME/.avm/bin:$HOME/.cargo/bin:$HOME/.local/share/solana/install/active_release/bin:$PATH"
        avm use ${{ inputs.anchor-version }}

    - name: Generate keypair for testing
      shell: bash
      run: |
        export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
        mkdir -p ~/.config/solana
        solana-keygen new --no-bip39-passphrase --silent --outfile ~/.config/solana/id.json
        solana config set --url localhost

    - name: Verify installations
      shell: bash
      run: |
        export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.avm/bin:$PATH"
        solana --version
        anchor --version
        # Records the platform-tools/rustc this Solana CLI defaults to. `anchor build` does NOT
        # use it -- anchor-cli 1.x hard-codes `--tools-version v1.52` -- so this is informational
        # only; assert-sbf-rustc.sh checks what the build actually used.
        cargo build-sbf --version
