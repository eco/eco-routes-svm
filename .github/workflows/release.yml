name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  RUST_VERSION: "1.97.1"
  ANCHOR_VERSION: "1.1.2"
  # Exact Solana CLI version, pinned rather than tracking "stable". Note this no longer
  # decides the on-chain compiler: anchor-cli 1.x hard-codes `--tools-version v1.52` when it
  # shells out to `cargo build-sbf`, so it overrides whatever platform-tools this CLI defaults
  # to. This pins the CLI tooling only.
  SOLANA_VERSION: "4.1.1"
  # The rustc `anchor build` actually uses for the programs, asserted after every build.
  # Changing this changes the compiler that produces deployed bytecode -- do it deliberately.
  # Comes from anchor's hard-coded platform-tools version below; bump both only alongside
  # ANCHOR_VERSION.
  SBF_RUSTC_VERSION: "1.89.0-dev"
  # The platform-tools version anchor-cli hard-codes in `cargo build-sbf --tools-version`
  # (BUILD_SUBCOMMAND in its cli/src/lib.rs). Asserted together with SBF_RUSTC_VERSION.
  SBF_TOOLS_VERSION: "v1.52"
  # Production programs only. The localnet test programs (dummy-ism, mock-polymer-prover,
  # malicious-*) must never reach a release, so assets are copied by name, never by glob.
  RELEASED_PROGRAMS: "aggregator_prover portal hyper_prover local_prover flash_fulfiller proof_helper polymer_prover"

jobs:
  release:
    runs-on: ubuntu-latest
    # Holds PROGRAM_KEYPAIR_SECRET; anyone with it can claim a release's program addresses.
    environment: release
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          rust-version: ${{ env.RUST_VERSION }}
          cache-key-suffix: release

      - name: Setup Anchor
        uses: ./.github/actions/setup-anchor
        with:
          anchor-version: ${{ env.ANCHOR_VERSION }}
          solana-version: ${{ env.SOLANA_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Compute next version (dry run)
        id: dry
        uses: cycjimmy/semantic-release-action@v6
        with:
          dry_run: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The committed declare_id!s are placeholders. Each program's real ID is seeded by its
      # placeholder build and those of the programs whose IDs it compiles in, so unchanged
      # bytecode keeps its address. Cargo.toml versions are not bumped: a bump changes the
      # bytecode of every dependent of eco-svm-std.
      - name: Build placeholder programs
        if: steps.dry.outputs.new_release_published == 'true'
        run: |
          for cluster in mainnet devnet; do
            rm -rf target/idl target/deploy
            anchor run "build-${cluster}"
            mkdir -p "target/placeholder/${cluster}"
            for program in $RELEASED_PROGRAMS; do
              cp "target/deploy/${program}.so" "target/placeholder/${cluster}/"
            done
          done

      - name: Assert on-chain compiler
        if: steps.dry.outputs.new_release_published == 'true'
        run: scripts/assert-sbf-rustc.sh ${{ env.SBF_RUSTC_VERSION }} ${{ env.SBF_TOOLS_VERSION }}

      # The deployer re-derives the same keypairs from the published program-ids.json instead
      # of receiving them. Both clusters share the IDs. The rewritten declare_id!s are never
      # committed.
      - name: Derive program IDs
        if: steps.dry.outputs.new_release_published == 'true'
        env:
          PROGRAM_KEYPAIR_SECRET: ${{ secrets.PROGRAM_KEYPAIR_SECRET }}
        run: |
          rm -rf target/deploy
          # shellcheck disable=SC2086 # RELEASED_PROGRAMS is a word list
          node scripts/program-keypairs.mjs release target/placeholder target/deploy $RELEASED_PROGRAMS \
            > target/program-ids.json
          jq -r 'to_entries[] | "\(.key) \(.value.address)"' target/program-ids.json > target/program-ids.txt
          cat target/program-ids.txt
          while read -r program address; do
            lib="programs/${program//_/-}/src/lib.rs"
            sed -i "s/declare_id!(\"[^\"]*\")/declare_id!(\"${address}\")/" "$lib"
            grep -q "declare_id!(\"${address}\")" "$lib"
          done < target/program-ids.txt

      # Every program's bytecode and three IDLs (hyper_prover, polymer_prover, proof_helper)
      # embed feature-gated addresses, so each cluster gets its own .so and IDL set.
      - name: Build release programs
        if: steps.dry.outputs.new_release_published == 'true'
        env:
          VERSION: ${{ steps.dry.outputs.new_release_version }}
        run: |
          for cluster in mainnet devnet; do
            rm -rf target/idl target/deploy/*.so
            anchor run "build-${cluster}"
            mkdir -p "dist/idl/${cluster}" "dist/program/${cluster}"
            while read -r program address; do
              test "$(jq -r .address "target/idl/${program}.json")" = "$address"
              jq --arg version "$VERSION" '.metadata.version = $version' "target/idl/${program}.json" \
                > "dist/idl/${cluster}/${program}.${cluster}.json"
              cp "target/deploy/${program}.so" "dist/program/${cluster}/${program}.${cluster}.so"
            done < target/program-ids.txt
          done
          cp target/program-ids.json dist/program-ids.json
          cp scripts/program-keypairs.mjs dist/program-keypairs.mjs

      - name: Discard program keypairs
        if: always()
        run: rm -f target/deploy/*-keypair.json

      - name: Release
        id: semantic
        if: steps.dry.outputs.new_release_published == 'true'
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Verifiable builds rebuild a commit, so tag one carrying the real program IDs (public
      # keys only) on top of the release commit. main and the maintenance branch never see
      # it, and CI does not test it: the PDA goldens are pinned to the placeholder IDs.
      - name: Tag program IDs
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          VERSION: ${{ steps.semantic.outputs.new_release_version }}
        run: |
          git add programs/*/src/lib.rs
          test "$(git diff --cached --name-only | wc -l)" -eq "$(wc -l < target/program-ids.txt)"
          commit=$(git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit-tree "$(git write-tree)" -p HEAD -m "chore: program IDs for v${VERSION}")
          git tag "deploy/v${VERSION}" "$commit"
          git push origin "refs/tags/deploy/v${VERSION}"

      - name: Create maintenance branch
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          VERSION="${{ steps.semantic.outputs.new_release_version }}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          BRANCH="releases/${MAJOR}.${MINOR}.x"
          git push origin "refs/tags/v${VERSION}:refs/heads/${BRANCH}"
