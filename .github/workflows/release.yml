name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  RUST_VERSION: "1.97.1"
  ANCHOR_VERSION: "1.1.2"
  # Exact Solana CLI version, pinned rather than tracking "stable". Note this no longer
  # decides the on-chain compiler: anchor-cli 1.x hard-codes `--tools-version v1.52` when it
  # shells out to `cargo build-sbf`, so it overrides whatever platform-tools this CLI defaults
  # to. This pins the CLI tooling only.
  SOLANA_VERSION: "4.1.1"
  # The rustc `anchor build` actually uses for the programs, asserted after every build.
  # Changing this changes the compiler that produces deployed bytecode -- do it deliberately.
  # Comes from anchor's hard-coded platform-tools version below; bump both only alongside
  # ANCHOR_VERSION.
  SBF_RUSTC_VERSION: "1.89.0-dev"
  # The platform-tools version anchor-cli hard-codes in `cargo build-sbf --tools-version`
  # (BUILD_SUBCOMMAND in its cli/src/lib.rs). Asserted together with SBF_RUSTC_VERSION.
  SBF_TOOLS_VERSION: "v1.52"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          rust-version: ${{ env.RUST_VERSION }}
          cache-key-suffix: release

      - name: Setup Anchor
        uses: ./.github/actions/setup-anchor
        with:
          anchor-version: ${{ env.ANCHOR_VERSION }}
          solana-version: ${{ env.SOLANA_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Compute next version (dry run)
        id: dry
        uses: cycjimmy/semantic-release-action@v6
        with:
          dry_run: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump Cargo.toml versions (runner-only, never committed)
        if: steps.dry.outputs.new_release_published == 'true'
        run: scripts/bump-cargo-versions.sh ${{ steps.dry.outputs.new_release_version }}

      - name: Build mainnet IDLs
        if: steps.dry.outputs.new_release_published == 'true'
        run: |
          rm -rf target/idl
          anchor run build-mainnet
          mkdir -p dist/idl/mainnet
          for program in portal hyper_prover local_prover flash_fulfiller proof_helper; do
            cp "target/idl/${program}.json" "dist/idl/mainnet/${program}.mainnet.json"
          done

      - name: Assert on-chain compiler
        if: steps.dry.outputs.new_release_published == 'true'
        run: scripts/assert-sbf-rustc.sh ${{ env.SBF_RUSTC_VERSION }} ${{ env.SBF_TOOLS_VERSION }}

      - name: Build devnet IDLs
        if: steps.dry.outputs.new_release_published == 'true'
        run: |
          rm -rf target/idl
          anchor run build-devnet
          mkdir -p dist/idl/devnet
          for program in portal hyper_prover local_prover flash_fulfiller proof_helper; do
            cp "target/idl/${program}.json" "dist/idl/devnet/${program}.devnet.json"
          done

      - name: Release
        id: semantic
        if: steps.dry.outputs.new_release_published == 'true'
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create maintenance branch
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          VERSION="${{ steps.semantic.outputs.new_release_version }}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          BRANCH="releases/${MAJOR}.${MINOR}.x"
          git push origin "refs/tags/v${VERSION}:refs/heads/${BRANCH}"
