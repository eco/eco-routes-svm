name: Deploy

# Deploys, initializes, reads back and verifies a release; never finalizes (finalize.yml does,
# after testing). Run twice: once with an empty plan_hash (plans, writes the summary, changes
# nothing), then again with the reviewed hash. The hash covers chain state, so any drift between
# the two runs makes the second a dry run again.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, without the v"
        type: string
        required: true
      cluster:
        description: "Target cluster; selects the Alchemy endpoint"
        type: choice
        options: [devnet, mainnet]
        required: true
      plan_hash:
        description: "plan_hash from a reviewed dry run; empty or mismatched plans only"
        type: string
        default: ""
      hyper_senders:
        description: "Comma-separated EVM addresses (20-byte hex) allowed to send via hyper_prover"
        type: string
        default: ""
      polymer_emitters:
        description: "Comma-separated EVM addresses allowed to emit via polymer_prover"
        type: string
        default: ""
      layerzero:
        description: 'JSON {"peers":[{"eid","address","chain_id","path":{"send_uln","receive_uln","executor"}}]}'
        type: string
        default: ""
      hyper_reserve_lamports:
        description: "Top-up for the hyper_prover pda_payer"
        type: string
        default: "0"
      layerzero_reserve_lamports:
        description: "Top-up for the layerzero_prover pda_payer; the plan refuses one that cannot pay its paths' endpoint/ULN rent"
        type: string
        default: "0"
      compute_unit_price:
        description: "Micro-lamports per compute unit for deploys and init transactions; 0 adds nothing. Part of the plan hash"
        type: string
        default: "0"

concurrency:
  group: deploy-${{ inputs.cluster }}
  cancel-in-progress: false

permissions:
  contents: read

# bash -eo pipefail: a failing command piped into tee must fail the step.
defaults:
  run:
    shell: bash

env:
  RUST_VERSION: "1.97.1"
  ANCHOR_VERSION: "1.1.2"
  SOLANA_VERSION: "4.1.1"
  # Must equal release.yml's: verification rebuilds the released bytecode in this image.
  VERIFY_IMAGE: "solanafoundation/solana-verifiable-build@sha256:0b4e3716fad9ca4b4aac3e3f977f43aad93a18c22296c0c0f44fc22e644bdd68"
  SOLANA_VERIFY_VERSION: "0.5.2"

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The release environment's required reviewers gate this job; it holds
    # PROGRAM_KEYPAIR_SECRET, DEPLOYER_KEYPAIR and ALCHEMY_API_KEY, shared by both clusters.
    environment: release
    env:
      VERSION: ${{ inputs.version }}
      CLUSTER: ${{ inputs.cluster }}
      ASSETS: release
      PLAN: out/plan.json
    steps:
      - name: Validate inputs
        env:
          COMPUTE_UNIT_PRICE: ${{ inputs.compute_unit_price }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "invalid version" >&2; exit 1; }
          # At most 19 digits always fits the deployer's u64.
          [[ "$COMPUTE_UNIT_PRICE" =~ ^[0-9]{1,19}$ ]] || { echo "compute_unit_price must be a non-negative integer" >&2; exit 1; }

      - name: Checkout deploy tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/deploy/v${{ inputs.version }}

      - name: Setup deployer
        uses: ./.github/actions/setup-deployer
        with:
          rust-version: ${{ env.RUST_VERSION }}
          anchor-version: ${{ env.ANCHOR_VERSION }}
          solana-version: ${{ env.SOLANA_VERSION }}
          deployer-keypair: ${{ secrets.DEPLOYER_KEYPAIR }}
          github-token: ${{ github.token }}

      - name: Install solana-verify
        run: cargo install solana-verify --version "$SOLANA_VERIFY_VERSION" --locked

      - name: Plan
        id: plan
        env:
          RPC_URL: https://solana-${{ inputs.cluster }}.g.alchemy.com/v2/${{ secrets.ALCHEMY_API_KEY }}
          PLAN_HASH: ${{ inputs.plan_hash }}
          HYPER_SENDERS: ${{ inputs.hyper_senders }}
          POLYMER_EMITTERS: ${{ inputs.polymer_emitters }}
          LAYERZERO: ${{ inputs.layerzero }}
          HYPER_RESERVE_LAMPORTS: ${{ inputs.hyper_reserve_lamports }}
          LAYERZERO_RESERVE_LAMPORTS: ${{ inputs.layerzero_reserve_lamports }}
          COMPUTE_UNIT_PRICE: ${{ inputs.compute_unit_price }}
        run: |
          mkdir -p out
          deployer plan --version "$VERSION" --cluster "$CLUSTER" \
            --program-ids "$ASSETS/program-ids.json" --assets "$ASSETS" --out "$PLAN" \
            --summary "$GITHUB_STEP_SUMMARY" --deployer-keypair "$KEYPAIR" 2>&1 \
            | scripts/deploy-step.sh redact | tee out/plan.log
          scripts/deploy-step.sh gate out/plan.log

      - name: Derive program keypairs
        if: steps.plan.outputs.execute == 'true'
        env:
          PROGRAM_KEYPAIR_SECRET: ${{ secrets.PROGRAM_KEYPAIR_SECRET }}
        run: node scripts/program-keypairs.mjs deploy "$ASSETS/program-ids.json" target/keys

      - name: Deploy new programs
        if: steps.plan.outputs.execute == 'true'
        env:
          RPC_URL: https://solana-${{ inputs.cluster }}.g.alchemy.com/v2/${{ secrets.ALCHEMY_API_KEY }}
        run: scripts/deploy-step.sh deploy 2>&1 | scripts/deploy-step.sh redact | tee out/deploy.log

      - name: Apply
        if: steps.plan.outputs.execute == 'true'
        env:
          RPC_URL: https://solana-${{ inputs.cluster }}.g.alchemy.com/v2/${{ secrets.ALCHEMY_API_KEY }}
        run: |
          deployer apply --plan "$PLAN" --assets "$ASSETS" --deployer-keypair "$KEYPAIR" 2>&1 \
            | scripts/deploy-step.sh redact | tee out/apply.log

      - name: Verify
        if: steps.plan.outputs.execute == 'true'
        env:
          RPC_URL: https://solana-${{ inputs.cluster }}.g.alchemy.com/v2/${{ secrets.ALCHEMY_API_KEY }}
        run: scripts/deploy-step.sh verify 2>&1 | scripts/deploy-step.sh redact | tee out/verify.log

      # A failed or cancelled deploy leaves its buffer holding rent; return it to the deployer.
      - name: Close leftover buffers
        if: always() && steps.plan.outputs.execute == 'true'
        env:
          RPC_URL: https://solana-${{ inputs.cluster }}.g.alchemy.com/v2/${{ secrets.ALCHEMY_API_KEY }}
        run: scripts/deploy-step.sh close-buffers 2>&1 | scripts/deploy-step.sh redact | tee out/close-buffers.log

      - name: Delete keys
        if: always()
        run: rm -rf target/keys "$RUNNER_TEMP/deployer.json"

      - name: Upload deploy record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deploy-v${{ inputs.version }}-${{ inputs.cluster }}
          path: out/
          if-no-files-found: ignore
