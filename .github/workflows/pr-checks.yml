name: PR checks

on:
  pull_request:
  push:
    branches: [main]

env:
  RUST_VERSION: "1.97.1"
  ANCHOR_VERSION: "1.1.2"
  # Exact Solana CLI version, pinned rather than tracking "stable". Note this no longer
  # decides the on-chain compiler: anchor-cli 1.x hard-codes `--tools-version v1.52` when it
  # shells out to `cargo build-sbf`, so it overrides whatever platform-tools this CLI defaults
  # to. This pins the CLI tooling only.
  SOLANA_VERSION: "4.1.1"
  # The rustc `anchor build` actually uses for the programs, asserted after every build.
  # Changing this changes the compiler that produces deployed bytecode -- do it deliberately.
  # Comes from anchor's hard-coded platform-tools version below; bump both only alongside
  # ANCHOR_VERSION.
  SBF_RUSTC_VERSION: "1.89.0-dev"
  # The platform-tools version anchor-cli hard-codes in `cargo build-sbf --tools-version`
  # (BUILD_SUBCOMMAND in its cli/src/lib.rs). Asserted together with SBF_RUSTC_VERSION.
  SBF_TOOLS_VERSION: "v1.52"

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          rust-version: nightly
          components: rustfmt
          cache-key-suffix: format

      - name: Check Rust formatting
        run: cargo +nightly fmt --all -- --check

  import-sort:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          rust-version: ${{ env.RUST_VERSION }}
          cache-key-suffix: import-sort

      - name: Install cargo-sort
        run: |
          if ! command -v cargo-sort &> /dev/null; then
            cargo install cargo-sort
          fi

      - name: Check import sorting
        run: cargo sort --workspace --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          rust-version: ${{ env.RUST_VERSION }}
          components: clippy
          cache-key-suffix: clippy

      - name: Setup Anchor
        uses: ./.github/actions/setup-anchor
        with:
          anchor-version: ${{ env.ANCHOR_VERSION }}
          solana-version: ${{ env.SOLANA_VERSION }}

      - name: Build Anchor programs
        run: anchor build

      - name: Assert on-chain compiler
        run: scripts/assert-sbf-rustc.sh ${{ env.SBF_RUSTC_VERSION }} ${{ env.SBF_TOOLS_VERSION }}

      - name: Build mock-igp (non-Anchor test program)
        run: cargo build-sbf --manifest-path integration-tests/programs/mock-igp/Cargo.toml --sbf-out-dir target/deploy

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          rust-version: ${{ env.RUST_VERSION }}
          cache-key-suffix: test

      - name: Setup Anchor
        uses: ./.github/actions/setup-anchor
        with:
          anchor-version: ${{ env.ANCHOR_VERSION }}
          solana-version: ${{ env.SOLANA_VERSION }}

      - name: Build Anchor programs
        run: anchor build

      - name: Assert on-chain compiler
        run: scripts/assert-sbf-rustc.sh ${{ env.SBF_RUSTC_VERSION }} ${{ env.SBF_TOOLS_VERSION }}

      - name: Build mock-igp (non-Anchor test program)
        run: cargo build-sbf --manifest-path integration-tests/programs/mock-igp/Cargo.toml --sbf-out-dir target/deploy

      - name: Run tests
        run: cargo test --no-fail-fast
