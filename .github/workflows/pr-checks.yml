name: PR checks

on:
  pull_request:
  push:
    branches: [main]

env:
  RUST_VERSION: "1.97.1"
  ANCHOR_VERSION: "1.1.2"
  # Exact Solana CLI version, pinned rather than tracking "stable". Note this no longer
  # decides the on-chain compiler: anchor-cli 1.x hard-codes `--tools-version v1.52` when it
  # shells out to `cargo build-sbf`, so it overrides whatever platform-tools this CLI defaults
  # to. This pins the CLI tooling only.
  SOLANA_VERSION: "4.1.1"
  # The rustc `anchor build` actually uses for the programs, asserted after every build.
  # Changing this changes the compiler that produces deployed bytecode -- do it deliberately.
  # Comes from anchor's hard-coded platform-tools version below; bump both only alongside
  # ANCHOR_VERSION.
  SBF_RUSTC_VERSION: "1.89.0-dev"
  # The platform-tools version anchor-cli hard-codes in `cargo build-sbf --tools-version`
  # (BUILD_SUBCOMMAND in its cli/src/lib.rs). Asserted together with SBF_RUSTC_VERSION.
  SBF_TOOLS_VERSION: "v1.52"

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # the tests compare the dependency graph against `cargo metadata`
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          rust-version: ${{ env.RUST_VERSION }}
          cache-key-suffix: scripts

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test release scripts
        run: node --test scripts/*.test.mjs

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          rust-version: nightly
          components: rustfmt
          cache-key-suffix: format

      - name: Check Rust formatting
        run: |
          cargo +nightly fmt --all -- --check
          cargo +nightly fmt --all --manifest-path packages/deployer/Cargo.toml -- --check

  import-sort:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          rust-version: ${{ env.RUST_VERSION }}
          cache-key-suffix: import-sort

      - name: Install cargo-sort
        run: |
          if ! command -v cargo-sort &> /dev/null; then
            cargo install cargo-sort
          fi

      - name: Check import sorting
        run: |
          cargo sort --workspace --check
          cargo sort --check packages/deployer

  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          rust-version: ${{ env.RUST_VERSION }}
          components: clippy
          cache-key-suffix: clippy

      - name: Setup Anchor
        uses: ./.github/actions/setup-anchor
        with:
          anchor-version: ${{ env.ANCHOR_VERSION }}
          solana-version: ${{ env.SOLANA_VERSION }}

      - name: Build Anchor programs
        run: anchor build

      - name: Assert on-chain compiler
        run: scripts/assert-sbf-rustc.sh ${{ env.SBF_RUSTC_VERSION }} ${{ env.SBF_TOOLS_VERSION }}

      - name: Build non-Anchor test programs
        run: |
          cargo build-sbf --manifest-path integration-tests/programs/mock-igp/Cargo.toml --sbf-out-dir target/deploy
          cargo build-sbf --manifest-path integration-tests/programs/mock-prover/Cargo.toml --sbf-out-dir target/deploy

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          rust-version: ${{ env.RUST_VERSION }}
          cache-key-suffix: test

      - name: Setup Anchor
        uses: ./.github/actions/setup-anchor
        with:
          anchor-version: ${{ env.ANCHOR_VERSION }}
          solana-version: ${{ env.SOLANA_VERSION }}

      - name: Build Anchor programs
        run: anchor build

      - name: Assert on-chain compiler
        run: scripts/assert-sbf-rustc.sh ${{ env.SBF_RUSTC_VERSION }} ${{ env.SBF_TOOLS_VERSION }}

      - name: Build non-Anchor test programs
        run: |
          cargo build-sbf --manifest-path integration-tests/programs/mock-igp/Cargo.toml --sbf-out-dir target/deploy
          cargo build-sbf --manifest-path integration-tests/programs/mock-prover/Cargo.toml --sbf-out-dir target/deploy

      - name: Run tests
        run: cargo test --no-fail-fast

  # The deployer is its own workspace (packages/deployer/Cargo.toml explains why); its tests
  # load the programs `anchor build` writes to target/deploy. Its build goes under target/ too,
  # which setup-rust caches.
  deployer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          rust-version: ${{ env.RUST_VERSION }}
          components: clippy
          cache-key-suffix: deployer

      - name: Setup Anchor
        uses: ./.github/actions/setup-anchor
        with:
          anchor-version: ${{ env.ANCHOR_VERSION }}
          solana-version: ${{ env.SOLANA_VERSION }}

      - name: Build Anchor programs
        run: anchor build

      - name: Assert on-chain compiler
        run: scripts/assert-sbf-rustc.sh ${{ env.SBF_RUSTC_VERSION }} ${{ env.SBF_TOOLS_VERSION }}

      - name: Run Clippy
        env:
          CARGO_TARGET_DIR: target/deployer
        run: cargo clippy --manifest-path packages/deployer/Cargo.toml --locked --all-targets -- -D warnings

      - name: Run tests
        env:
          CARGO_TARGET_DIR: target/deployer
        run: cargo test --manifest-path packages/deployer/Cargo.toml --locked --no-fail-fast

  workflow-lint:
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
      SHELLCHECK_VERSION: "0.11.0"
      SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install actionlint and shellcheck
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/bin" actionlint
          curl -sSfL -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP/bin" --strip-components 1 \
            "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # actionlint also runs shellcheck over every `run:` block.
      - name: Lint workflows
        run: actionlint

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh
